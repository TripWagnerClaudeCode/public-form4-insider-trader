rationale: >-
  Seed formula from the insider-trading literature. Open-market purchases (code P)
  by insiders predict positive abnormal returns, unlike sales which are mostly
  liquidity-driven (Lakonishok and Lee 2001; Jeng, Metrick and Zeckhauser 2003).
  Signal is stronger for clusters of buyers, for CEO/CFO purchases, for large
  dollar amounts relative to the insider's holdings, for first-time or
  long-dormant buyers (Cohen, Malloy and Pomorski 2012, opportunistic vs routine
  traders), for small caps, and after price drawdowns (contrarian buying).
  Purchases under a 10b5-1 plan are pre-scheduled and carry less information,
  so they are penalised. Weights are initial priors for the research loop to tune
  within hard bounds.
