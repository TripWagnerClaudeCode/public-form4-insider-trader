[project]
name = "form4-insider-trader"
description = "Follows SEC Form 4 insider buys: Claude agent review, hard risk rules, Alpaca paper only"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.44.0",
    "anthropic>=2.4.0",
    "edgartools>=5.62.1",
    # Pinned exactly, same as the sister project alpaca-llm-trader: upstream moved to an unverified GitHub org in 2026-09.
    "openbb==5.0.0",
    "openbb-yfinance==2.0.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insiderbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
